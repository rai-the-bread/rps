<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <header>
        <h1>Rock, Paper, Scissors</h1>
        <p>Choose your fighter!</p>
    </header>

    <div class="choices-container">
        <div class="choice-container">
            <img src="./assets/Rock.png" alt="Rock" id="rock" class="choice">
            <p>Rock</p>
        </div>
        <div class="choice-container">
            <img src="./assets/paper.png" alt="Paper" id="paper" class="choice">
            <p>Paper</p>
        </div>
        <div class="choice-container">
            <img src="./assets/scissors.png" alt="Scissors" id="scissors" class="choice">
            <p>Scissors</p>
        </div>
    </div>
    <div class="divider"></div>
    <div class="results">
        <p class="cp-choice"></p>
        <p class="result"></p>
    </div>
    <script src="./script.js"></script>
</body>
</html>
